# Netlify build config for the Pickle Duels marketing site.
# The build is a single zero-dependency Python script, so no package install
# step is needed — Netlify's build image already ships Python 3.

[build]
  command = "python3 build.py"
  publish = "dist"

# Long-cache the fingerprint-free static assets we control.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
